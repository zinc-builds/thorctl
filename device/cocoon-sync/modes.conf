# platformId  mode     emulator Cocoon uses (Settings > Library) and why
# Example for the emulators the README recommends. To use your own without editing the repo,
# copy this file to local/cocoon-sync/modes.conf: `thorctl sync-install` pushes that copy instead.
# group: discs stay in the folder as "(Disc N)"; Cocoon shows one entry and launches disc 1.
# m3u:   Name.m3u in the folder, discs in .hidden/; the emulator swaps discs itself.
# Platforms not listed are imported but never rearranged.
psx        group    # DuckStation cannot open an .m3u passed as content:// (tested 2026-10-23)
ps2        group    # ARMSX2 has no .m3u support; swap discs in-game
saturn     m3u      # RetroArch Beetle Saturn reads .m3u with relative paths
dreamcast  m3u      # RetroArch Flycast reads .m3u with relative paths
